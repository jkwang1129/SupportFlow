<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="我">
  <defs>
    <!-- 客户自己的头像：青蓝渐变，和机器人（蓝紫）区分开，同一套视觉语言 -->
    <linearGradient id="userBg" x1="14" y1="8" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="userSheen" x1="20" y1="6" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="48" cy="48" r="48" fill="url(#userBg)"/>
  <circle cx="48" cy="48" r="48" fill="url(#userSheen)"/>
  <circle cx="48" cy="48" r="46.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- 人物剪影：头 + 肩，纯几何，32px 下依然是个清爽的"人" -->
  <circle cx="48" cy="38" r="13" fill="#ffffff"/>
  <path d="M23 79.5a25 25 0 0 1 50 0z" fill="#ffffff"/>
</svg>
