<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="智能客服">
  <defs>
    <!-- 底色：品牌蓝 → 靛紫，斜向渐变，比纯色更有质感 -->
    <linearGradient id="botBg" x1="14" y1="6" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cf7"/>
      <stop offset="0.52" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- 左上角一层柔和高光：让扁平的圆看起来有光 -->
    <linearGradient id="botSheen" x1="20" y1="6" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="48" cy="48" r="48" fill="url(#botBg)"/>
  <circle cx="48" cy="48" r="48" fill="url(#botSheen)"/>
  <!-- 内描边：小尺寸下把圆形边缘收干净 -->
  <circle cx="48" cy="48" r="46.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- 客服耳机：头梁 + 两侧听筒 + 麦克风，纯几何形状，32px 下依然认得出来 -->
  <path d="M27 52V45.5a21 21 0 0 1 42 0V52" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round"/>
  <rect x="20.5" y="47" width="13" height="20" rx="6.5" fill="#ffffff"/>
  <rect x="62.5" y="47" width="13" height="20" rx="6.5" fill="#ffffff"/>
  <path d="M69 67.5v3.2a6.2 6.2 0 0 1-6.2 6.2H58" fill="none" stroke="#ffffff"
        stroke-width="5" stroke-linecap="round"/>
  <circle cx="55.5" cy="76.9" r="4.1" fill="#ffffff"/>

  <!-- 左下角一点"智能"星光，很淡，不抢主体 -->
  <path d="M24 68.5l1.5 3.7 3.7 1.5-3.7 1.5-1.5 3.7-1.5-3.7-3.7-1.5 3.7-1.5z"
        fill="#ffffff" fill-opacity="0.75"/>
</svg>
