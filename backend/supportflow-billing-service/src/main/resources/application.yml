server:
  port: 9094

spring:
  application:
    name: supportflow-billing-service
  datasource:
    url: jdbc:postgresql://${SUPPORTFLOW_DB_HOST:127.0.0.1}:${SUPPORTFLOW_DB_PORT:5432}/${SUPPORTFLOW_BILLING_DB:billing_db}
    username: ${SUPPORTFLOW_DB_USER:supportflow}
    password: ${SUPPORTFLOW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

supportflow:
  id:
    worker-id: ${SUPPORTFLOW_WORKER_ID:4}
  auth:
    # JWT 签名密钥：与 user-service 一致，生产必须用环境变量覆盖
    jwt-secret: ${SUPPORTFLOW_JWT_SECRET}
  tenant:
    # tenant-service 内部接口：支付成功后把套餐与到期时间写回租户（设计文档 §"租户开通"）
    internal-base-url: ${SUPPORTFLOW_TENANT_INTERNAL_URL:http://127.0.0.1:9092}
  billing:
    # 月度自动出账：每月 1 号 00:10 给所有活跃租户结上一个自然月的账
    #   秒 分 时 日 月 周：0 10 0 1 * ? = 每月 1 日 00:10
    #   想立刻验证可以把表达式改成 "0 */5 * * * ?"（每 5 分钟跑一次）
    statement-cron: ${SUPPORTFLOW_STATEMENT_CRON:0 10 0 1 * ?}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
