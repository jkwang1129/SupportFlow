name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install -r scripts/security/requirements.txt pytest
      - name: Verify all Java modules
        run: mvn -B -f backend/pom.xml verify
      - name: Verify PostgreSQL tenant isolation and knowledge store
        run: python scripts/test-customer-rls.py --with-ai
      - name: Verify AI service authorization
        working-directory: ai-service
        run: python -m pytest -q
      - name: Verify fresh and legacy runtime database privileges
        run: python scripts/test-runtime-security.py
      - name: Verify runtime credential distribution
        run: python -m unittest discover -s scripts/security -p 'unit_*.py' -v
      - name: Verify actual service flows with restricted identities
        run: python scripts/test-security-flow.py
      - name: Preserve Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
